name: travel_buddy
description: TravelBuddy AI - Smart travel planning with AI-powered itineraries and reel generation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.1
  riverpod: ^2.4.0
  hooks_riverpod: ^2.4.0

  # HTTP & Networking
  http: ^1.2.0
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Image Picking & Display
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  cached_network_image: ^3.3.1

  # Video Player
  video_player: ^2.8.3
  chewie: ^1.7.4

  # Storage & Local Data
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_cache_manager: ^3.3.2
  gal: ^2.3.0

  # UI & Animations - Enhanced
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  smooth_page_indicator: ^1.1.0
  

  # Advanced UI Components
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  dotted_border: ^2.1.0
  percent_indicator: ^4.1.0

  # Typography & Styling
  google_fonts: ^6.1.0

  # File Handling
  path_provider: ^2.1.2
  open_file: ^3.3.2
  permission_handler: ^11.0.0

  # Share
  share_plus: ^7.2.2

  # Notifications / Toast
  fluttertoast: ^8.2.4
  flutter_local_notifications: ^17.2.4

  # Icons - Extended
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  material_design_icons_flutter: ^7.0.7296

  # Internationalization
  intl: ^0.19.0

  # Utils & Helpers
  uuid: ^4.0.0
  intl_utils: ^2.8.5
  equatable: ^2.0.5
  
  # Map display
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
