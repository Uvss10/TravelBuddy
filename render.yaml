services:
  - type: web
    name: travelbuddy-ai-engine
    env: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: SUPABASE_KEY
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: PORT
        value: 8000
